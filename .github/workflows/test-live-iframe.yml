name: Live YouTube iframe playback smoke test

on:
  push:
    branches: [main]
    paths:
      - 'tests/live-iframe.cjs'
      - '.github/workflows/test-live-iframe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-audio:
    name: Three Free Roam sources in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned official browser automation tool (CI only)
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local ambience web server
        run: |
          python3 -m http.server 48721 --bind 127.0.0.1 --directory updates/payload/ambience > /tmp/ambience.log 2>&1 &
          echo $! > /tmp/ambience.pid
          sleep 2
      - name: Try each Free Roam source in the embedded YouTube player
        run: node tests/live-iframe.cjs
      - name: Save screenshots and browser source report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-iframe-results
          path: |
            live-*.png
            live-youtube-results.json
          if-no-files-found: ignore
          retention-days: 7
